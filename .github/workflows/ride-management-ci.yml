name: Ride Management CI

on:
  push:
    branches:
      - feature/ride-management-service
      - main
    paths:
      - 'ride-management-service/**'
      - '.github/workflows/ride-management-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ride-management-service/**'
      - '.github/workflows/ride-management-ci.yml'
  workflow_dispatch:

jobs:
  test:
    name: Run Ride Management Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ride-management-service

    env:
      MONGODB_URI: mongodb://localhost:27017/ridelink_test
      JWT_SECRET: 0123456789012345678901234567890123456789012345678901234567890123
      DRIVER_SERVICE_URL: http://localhost:8082

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run automated tests
        run: mvn -B test
