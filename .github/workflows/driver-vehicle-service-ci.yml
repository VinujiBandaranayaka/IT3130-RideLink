name: Driver and Vehicle Service CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build and test Driver and Vehicle Service
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    defaults:
      run:
        working-directory: driver-vehicle-service

    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: driver-vehicle-service/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run Maven tests
        run: ./mvnw -B clean test