name: Fare Payment Service CI

on:
  push:
    branches:
      - main
      - feature/member4-fare-payment

  pull_request:
    branches:
      - main

jobs:

  build-and-test:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: fare-payment-service

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: fare-payment-service/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run Maven tests
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: ./mvnw -B clean test